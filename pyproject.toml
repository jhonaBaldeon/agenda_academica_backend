[project]
name = "agenda-academica-backend"
version = "0.1.0"
description = "Backend para la Agenda Académica con FastAPI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "openai>=1.12.0",
    "python-dotenv>=1.0.0",
    "firebase-admin>=6.4.0",
    "google-cloud-firestore>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
